name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check syntax and behavior
        run: |
          luac5.1 -p PlateFaction/*.lua tests/run.lua
          lua5.1 tests/run.lua
      - name: Validate package and tag version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
            git show-ref --verify "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
            ./scripts/Package.ps1 -Version $env:RELEASE_TAG.Substring(1)
          } else {
            ./scripts/Package.ps1
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build archive
        shell: pwsh
        run: ./scripts/Package.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "dist/PlateFaction-$version.zip" --verify-tag --title "PlateFaction $version" --notes-file CHANGELOG.md
